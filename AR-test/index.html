<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車輛 3D 空間 AR 展示</title>
  <!-- 載入 Google 開源的 model-viewer 庫 -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    /* AR 放置按鈕樣式 */
    .ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      background: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ar-button:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>
</head>
<body>

  <model-viewer 
    src="car.glb" 
    ios-src="car.usdz"
    alt="警車 3D 模型" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1"
    shadow-softness="0.8"
    auto-rotate>
    
    <button slot="ar-button" class="ar-button">
      🚗 點擊在地板放置警車 AR
    </button>
    
  </model-viewer>

</body>
</html>
